name: Security and quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/check-static-site.sh
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      PREP_BASE_URL: https://127.0.0.1:8444
      PREP_ENGINES: ${{ matrix.engine }}
      PORT: 8444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install locked test dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check document, image, accessibility and public-page journeys
        run: |
          set -euo pipefail
          node scripts/serve-local-https.cjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --insecure "$PREP_BASE_URL" >/dev/null; then
              npm run test:browser
              exit 0
            fi
            sleep 1
          done
          exit 1
